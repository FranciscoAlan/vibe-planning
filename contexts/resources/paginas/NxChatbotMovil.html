<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chatbot de soporte · móvil</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap"><style>body{margin:0}body{display:flex;justify-content:center;background:#E6D9CC}</style></head><body><div style="width:390px;height:844px;box-sizing:border-box;overflow:hidden;background:#2B1B3D;color:#2B1B3D;padding:48px 0 0;display:flex;flex-direction:column;font-family:'Plus Jakarta Sans',sans-serif"><div style="flex:1;background:#FFF8F1;border-top-left-radius:20px;border-top-right-radius:20px;overflow:hidden"><div style="width:390px;max-width:100%;background:#fff;border:1px solid #E6D9CC;border-radius:16px;border:2px solid #2B1B3D;overflow:hidden;display:flex;flex-direction:column"><div style="background:#2B1B3D;color:#FFF8F1;padding:14px;display:flex;justify-content:space-between;align-items:center"><span><b>Asistente Vibe</b><br><span style="font-size:12px">Respuestas automáticas · [HORARIO]</span></span><span aria-label="Cerrar">✕</span></div><div style="padding:14px;display:flex;flex-direction:column;gap:10px;min-height:260px"><div style="align-self:flex-start;max-width:75%;background:#fff;color:#2B1B3D;border:1px solid #E6D9CC;border-radius:16px;padding:10px 12px;font-size:14px"><span style="font-size:11px;font-weight:700">Asistente</span><br>Hola, ¿en qué te ayudo?</div><div style="display:flex;gap:6px;flex-wrap:wrap"><button style="min-height:44px;padding:0 16px;border-radius:22px;border:2px solid #2B1B3D;background:transparent;color:#2B1B3D;font:600 14px 'Plus Jakarta Sans',sans-serif;min-height:40px;font-size:13px">Cancelar una reserva</button><button style="min-height:44px;padding:0 16px;border-radius:22px;border:2px solid #2B1B3D;background:transparent;color:#2B1B3D;font:600 14px 'Plus Jakarta Sans',sans-serif;min-height:40px;font-size:13px">Cambiar la fecha</button><button style="min-height:44px;padding:0 16px;border-radius:22px;border:2px solid #2B1B3D;background:transparent;color:#2B1B3D;font:600 14px 'Plus Jakarta Sans',sans-serif;min-height:40px;font-size:13px">Pagos y reembolsos</button><button style="min-height:44px;padding:0 16px;border-radius:22px;border:2px solid #2B1B3D;background:transparent;color:#2B1B3D;font:600 14px 'Plus Jakarta Sans',sans-serif;min-height:40px;font-size:13px">Hablar con una persona</button></div><div style="align-self:flex-end;max-width:75%;background:#2B1B3D;color:#FFF8F1;border:1px solid #E6D9CC;border-radius:16px;padding:10px 12px;font-size:14px"><span style="font-size:11px;font-weight:700">Tú</span><br>Quiero cambiar la fecha</div><div style="align-self:flex-start;max-width:75%;background:#fff;color:#2B1B3D;border:1px solid #E6D9CC;border-radius:16px;padding:10px 12px;font-size:14px"><span style="font-size:11px;font-weight:700">Asistente</span><br>Puedes modificarla desde tu reserva. [Enlace]. ¿Quieres hablar con una persona?</div></div><div style="padding:10px 14px;border-top:1px solid #E6D9CC;display:flex;gap:8px"><input aria-label="Mensaje" placeholder="Escribe tu duda" style="min-height:48px;box-sizing:border-box;border:2px solid #2B1B3D;border-radius:12px;background:#fff;padding:0 12px;font:400 15px 'Plus Jakarta Sans',sans-serif;width:100%;min-height:44px"><button style="min-height:44px;padding:0 18px;border-radius:22px;border:0;background:#C42A50;color:#fff;font:600 14px 'Plus Jakarta Sans',sans-serif">Enviar</button></div><div style="font-size:11px;text-align:center;padding:0 0 10px">Es un asistente automático. Puedes pedir hablar con una persona.</div></div></div></div></body></html>
