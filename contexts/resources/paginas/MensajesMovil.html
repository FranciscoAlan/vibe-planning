<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mensajes móvil</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap"><style>body{margin:0}a{color:#2B1B3D}body{display:flex;justify-content:center;background:#E6D9CC}</style></head><body><div style="width:390px;height:844px;box-sizing:border-box;overflow:hidden;background:#FFF8F1;color:#2B1B3D;padding:56px 20px 0;display:flex;flex-direction:column;gap:12px;font-family:'Plus Jakarta Sans',sans-serif"><div style="display:flex;justify-content:space-between;align-items:center"><div><b style="font-size:18px">[Cliente 1]</b><div style="font-size:12px">[Evento] · [FECHA]</div></div><button style="min-height:44px;padding:0 16px;border-radius:22px;border:2px solid #2B1B3D;background:transparent;color:#2B1B3D;font:600 14px 'Plus Jakarta Sans',sans-serif">Reserva</button></div><div style="flex:1;display:flex;flex-direction:column;gap:10px;border-top:1px solid #E6D9CC;padding-top:12px"><div style="align-self:center;font-size:11px;font-weight:600;padding:5px 10px;border-radius:12px;background:#E6D9CC">Solicitud de cotización enviada</div><div style="align-self:flex-start;max-width:75%;background:#fff;color:#2B1B3D;border:1px solid #E6D9CC;border-radius:16px;padding:10px 12px;font-size:14px">[Cliente]: ¿Hay disponibilidad el [FECHA]?</div><div style="align-self:flex-end;max-width:75%;background:#2B1B3D;color:#FFF8F1;border:1px solid #E6D9CC;border-radius:16px;padding:10px 12px;font-size:14px">Tú: Sí, te envío la cotización.</div><div style="align-self:flex-end;max-width:75%;background:#fff;border:1px solid #E6D9CC;border-radius:16px;border:2px solid #2B1B3D;padding:12px;font-size:13px"><b>Cotización</b><br><b style="font-size:20px">[MONTO]</b><div style="display:flex;gap:6px;padding-top:6px"><button style="min-height:48px;border:0;border-radius:24px;background:#C42A50;color:#fff;font:600 15px 'Plus Jakarta Sans',sans-serif;width:100%;min-height:40px;width:auto;padding:0 14px">Aceptar</button><button style="min-height:44px;padding:0 16px;border-radius:22px;border:2px solid #2B1B3D;background:transparent;color:#2B1B3D;font:600 14px 'Plus Jakarta Sans',sans-serif;min-height:40px">Negociar</button></div></div></div><div style="display:flex;gap:8px;padding-bottom:16px"><button aria-label="Adjuntar" style="min-height:44px;padding:0 16px;border-radius:22px;border:2px solid #2B1B3D;background:transparent;color:#2B1B3D;font:600 14px 'Plus Jakarta Sans',sans-serif;width:44px;padding:0">+</button><input aria-label="Mensaje" placeholder="Escribe un mensaje" style="min-height:48px;box-sizing:border-box;border:2px solid #2B1B3D;border-radius:24px;background:#fff;padding:0 18px;font:400 15px 'Plus Jakarta Sans',sans-serif;width:100%;min-height:44px;flex:1;min-width:0"><button style="min-height:48px;border:0;border-radius:24px;background:#C42A50;color:#fff;font:600 15px 'Plus Jakarta Sans',sans-serif;width:100%;width:auto;min-height:44px;padding:0 16px">Enviar</button></div></div></body></html>
